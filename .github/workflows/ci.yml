name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Where jobs run: the repo variable CI_RUNNER (Settings → Secrets and variables → Actions →
# Variables). "beelink" sends them to the self-hosted runner on the Beelink server (owner's choice,
# 2026-10-31, while GitHub-hosted minutes were blocked; setup in /srv/ci-runners there). Delete the
# variable to go back to GitHub's runners.
jobs:
  test:
    name: Test & Build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Content Collections
        run: bun run generate:collections

      - name: Check Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint:check

      - name: Type Check
        run: bun run type-check

      - name: Run Tests
        run: bun run test:run

      - name: Build
        run: bun run build

      # SEO check: serve a production build and check every page in the sitemap
      # (one h1, titles, descriptions, canonical, Open Graph/X tags, structured data, alt text)
      - name: SEO check
        run: |
          BUILD_TARGET=bun bun run build
          PORT=4173 bun .output/server/index.mjs > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/robots.txt > /dev/null && break; sleep 1; done
          bun run seo:check http://localhost:4173
